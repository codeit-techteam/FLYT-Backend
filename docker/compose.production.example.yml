# Example production-oriented compose — do NOT use with real secrets committed.
# Prefer DigitalOcean Managed PostgreSQL + Managed Redis/Valkey in production.

services:
  api:
    build:
      context: ..
      target: production
    restart: unless-stopped
    env_file:
      - ../.env.production
    ports:
      - "5000:5000"
    depends_on:
      - worker

  worker:
    build:
      context: ..
      target: production
    restart: unless-stopped
    env_file:
      - ../.env.production
    command: ["node", "dist/workers/index.js"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/flyt.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
