services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: flyt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flyt_db}
      POSTGRES_USER: ${POSTGRES_USER:-flyt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyt_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flyt_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flyt} -d ${POSTGRES_DB:-flyt_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: flyt-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-flyt_redis_secret}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - flyt_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-flyt_redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      target: development
    container_name: flyt-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flyt}:${POSTGRES_PASSWORD:-flyt_secret}@postgres:5432/${POSTGRES_DB:-flyt_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-flyt}:${POSTGRES_PASSWORD:-flyt_secret}@postgres:5432/${POSTGRES_DB:-flyt_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-flyt_redis_secret}@redis:6379
      PORT: 5000
    ports:
      - "${HOST_PORT:-5050}:5000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"

  worker:
    build:
      context: .
      target: development
    container_name: flyt-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flyt}:${POSTGRES_PASSWORD:-flyt_secret}@postgres:5432/${POSTGRES_DB:-flyt_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-flyt}:${POSTGRES_PASSWORD:-flyt_secret}@postgres:5432/${POSTGRES_DB:-flyt_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-flyt_redis_secret}@redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma generate && npm run dev:worker"
    profiles:
      - full

volumes:
  flyt_postgres_data:
  flyt_redis_data:
